# Keeps the blog block on the homepage in step with The Perspective Papers on Substack.
# Checks hourly and only commits when the latest posts have changed.
name: Update blog posts

on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

permissions:
  contents: write
  pages: write

concurrency:
  group: update-posts
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Refresh posts from Substack
        run: python3 scripts/update_posts.py

      - name: Commit and publish if the posts changed
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if git diff --quiet; then
            echo "No new posts."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "Update blog posts from Substack"
          git push
          # Pushes made with the workflow's own token don't start a Pages build, so ask for one
          gh api -X POST "repos/${{ github.repository }}/pages/builds"
